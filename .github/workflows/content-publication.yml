name: Record first content publication
on:
  push:
    branches: [main]
    paths: ['src/content/**/*.json', 'scripts/stamp-publication.mjs', '.github/workflows/content-publication.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: content-publication
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/stamp-publication.mjs
      - name: Save publication metadata
        run: |
          if git diff --quiet -- src/content; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content
          git commit -m 'Record first content publication [skip ci]'
          git push origin HEAD:main
